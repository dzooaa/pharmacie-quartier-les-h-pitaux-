<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D2050">
<title>Pharmacie Quartier des Hôpitaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Mise en page : colonne unique centrée, logo en tête, bouton principal puis liste d'actions. */
:root {
  --navy: #0D2050;
  --navy-raised: #142A66;
  --line: rgba(92, 255, 224, 0.2);
  --cyan: #5CFFE0;
  --mint: #8FFFC0;
  --green: #00E070;
  --ink: #FFFFFF;
  --muted: #A9B8D9;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--navy); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--navy);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.4;
  padding-block: max(32px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
main { width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

header { display: flex; flex-direction: column; gap: 20px; }
.mark { width: 72px; height: 72px; display: block; }
h1 {
  margin: 0;
  font-weight: 800;
  font-size: clamp(26px, 8.4vw, 38px);
  line-height: 1.02;
  letter-spacing: -0.01em;
  color: var(--cyan);
  text-transform: uppercase;
}
.quartier {
  margin: 0;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink);
}

.save {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 58px;
  border: 0; border-radius: 16px;
  background: var(--cyan); color: var(--navy);
  font: 800 15px/1 var(--font);
  letter-spacing: 0.08em; text-transform: uppercase;
  text-decoration: none; cursor: pointer;
  transition: background .15s ease, transform .15s ease;
}
.save:hover { background: var(--mint); }
.save:active { transform: scale(0.985); }
.save svg { width: 22px; height: 22px; flex: none; }

.actions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  min-height: 72px;
  background: var(--navy-raised);
  border: 1px solid var(--line);
  border-radius: 18px;
  color: var(--ink); text-decoration: none;
  transition: border-color .15s ease, background .15s ease;
}
.row:hover { border-color: var(--cyan); }
.ico {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border-radius: 14px;
  background: rgba(92, 255, 224, 0.1);
  color: var(--cyan);
}
.ico svg { width: 22px; height: 22px; }
.txt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.val { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chev { width: 20px; height: 20px; flex: none; color: var(--muted); }

footer {
  display: flex; flex-direction: column; gap: 6px;
  padding-top: 8px;
  font-size: 12px; color: var(--muted);
}
footer .cat {
  font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan); font-size: 12px;
}
footer b { color: var(--ink); font-weight: 600; }

a:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>

        <span class="txt"><span class="lbl">Site web</span><span class="val">pharmaciequartierhopitaux</span></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>

        <span class="txt"><span class="lbl">Localisation</span><span class="val">Voir sur Google Maps</span></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>

  <a class="save" id="save" href="contact.vcf" download="Pharmacie-Quartier-des-Hopitaux.vcf">

    <span class="cat">Pharmacie · Parapharmacie</span>
    <span>Réalisé par <b>Procardmaroc</b></span>
  </footer>
</main>

<script>
(function () {
  var NAME = "Pharmacie Parapharmacie Quartier des Hôpitaux";
  var vcf = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "FN:" + NAME,
    "N:;" + NAME + ";;;",
    "ORG:" + NAME,
    "X-ABShowAs:COMPANY",
    "TEL;TYPE=WORK,VOICE:+212522860654",
    "TEL;TYPE=CELL:+212627907121",
    "URL:https://pharmaciequartierhopitaux.com",
    "item1.URL:https://www.instagram.com/pharmaquartierdeshopitaux/",
    "item1.X-ABLabel:Instagram",
    "item2.URL:https://maps.app.goo.gl/bLEHcSWzokYUfxRr7",
    "item2.X-ABLabel:Localisation",
    "END:VCARD"
  ].join("\r\n") + "\r\n";

  var btn = document.getElementById("save");
  btn.addEventListener("click", function (e) {
    try {
      e.preventDefault();
      var blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "Pharmacie-Quartier-des-Hopitaux.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    } catch (err) {
      window.location.href = "contact.vcf";
    }
  });
})();
</script>
</body>
</html>
